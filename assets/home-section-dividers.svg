<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 96" role="img" aria-labelledby="title desc">
  <title id="title">香港街区分隔动图集合</title>
  <desc id="desc">三种香港主题分隔条：公共巴士路线、海港天星小轮、街市招牌声波。</desc>
  <defs>
    <linearGradient id="band" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#18766f"/>
      <stop offset=".48" stop-color="#f1bd38"/>
      <stop offset="1" stop-color="#c8342f"/>
    </linearGradient>
    <style>
      .scene {
        display: none;
      }

      svg[data-scene="bus"] .scene-bus,
      svg[data-scene="harbour"] .scene-harbour,
      svg[data-scene="market"] .scene-market {
        display: block;
      }

      svg:not([data-scene]) .scene-bus {
        display: block;
      }

      .track {
        fill: none;
        stroke: #182527;
        stroke-linecap: round;
        stroke-width: 5;
        opacity: .18;
      }

      .dash {
        fill: none;
        stroke: url(#band);
        stroke-dasharray: 28 18;
        stroke-linecap: round;
        stroke-width: 8;
        animation: ride 4s linear infinite;
      }

      .wave {
        fill: none;
        stroke-dasharray: 12 14;
        stroke-linecap: round;
        stroke-width: 6;
        animation: ride 3.2s linear infinite reverse;
        opacity: .72;
      }

      .sign,
      .boat,
      .lantern {
        animation: glow 2.8s ease-in-out infinite;
        transform-origin: center;
      }

      .boat {
        animation-duration: 4.2s;
      }

      @keyframes ride {
        to { stroke-dashoffset: -92; }
      }

      @keyframes glow {
        0%, 100% { opacity: .72; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-3px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .dash,
        .wave,
        .sign,
        .boat,
        .lantern {
          animation: none;
        }
      }
    </style>
  </defs>

  <rect width="1180" height="96" rx="8" fill="#fffaf0"/>

  <g class="scene scene-bus">
    <path class="track" d="M32 58C156 34 266 68 392 44S646 30 784 52 1010 70 1148 40"/>
    <path class="dash" d="M32 58C156 34 266 68 392 44S646 30 784 52 1010 70 1148 40"/>
    <path class="wave" d="M74 75C110 56 142 56 178 75S250 94 286 75" stroke="#18766f"/>
    <path class="wave" d="M858 26C894 8 930 8 966 26S1038 44 1074 26" stroke="#18766f"/>
    <g class="sign">
      <rect x="516" y="20" width="148" height="46" rx="8" fill="#18766f"/>
      <rect x="530" y="32" width="120" height="8" rx="4" fill="#fffaf0"/>
      <rect x="530" y="48" width="76" height="8" rx="4" fill="#f1bd38"/>
    </g>
    <circle cx="238" cy="38" r="9" fill="#c8342f" opacity=".82"/>
    <circle cx="752" cy="64" r="9" fill="#f1bd38" opacity=".9"/>
    <circle cx="1094" cy="58" r="9" fill="#18766f" opacity=".82"/>
  </g>

  <g class="scene scene-harbour">
    <path d="M42 64C160 48 250 76 370 58S604 38 746 60 996 82 1138 48" fill="none" stroke="#18766f" stroke-width="7" stroke-linecap="round" stroke-dasharray="24 18" class="dash"/>
    <path class="wave" d="M70 74C142 58 196 58 268 74S414 90 486 74" stroke="#5a9ea0"/>
    <path class="wave" d="M702 34C762 18 822 18 882 34S1002 50 1062 34" stroke="#c8342f"/>
    <g class="boat">
      <path d="M506 54H672L646 76H534Z" fill="#18766f"/>
      <rect x="546" y="30" width="86" height="28" rx="7" fill="#fffaf0" stroke="#182527" stroke-width="5"/>
      <rect x="562" y="40" width="54" height="6" rx="3" fill="#f1bd38"/>
    </g>
    <circle cx="206" cy="46" r="8" fill="#f1bd38"/>
    <circle cx="942" cy="66" r="8" fill="#c8342f"/>
  </g>

  <g class="scene scene-market">
    <path d="M38 50H1142" fill="none" stroke="#ded3c2" stroke-width="5" stroke-linecap="round"/>
    <path d="M58 50C112 22 166 78 220 50S328 22 382 50 490 78 544 50 652 22 706 50 814 78 868 50 976 22 1030 50 1108 62 1144 42" fill="none" stroke="url(#band)" stroke-width="8" stroke-linecap="round" stroke-dasharray="18 16" class="dash"/>
    <g class="lantern">
      <rect x="156" y="20" width="104" height="42" rx="8" fill="#c8342f"/>
      <rect x="176" y="32" width="64" height="7" rx="3.5" fill="#fffaf0"/>
      <rect x="176" y="46" width="42" height="7" rx="3.5" fill="#f1bd38"/>
    </g>
    <g class="lantern" style="animation-delay:.45s">
      <rect x="760" y="22" width="132" height="42" rx="8" fill="#18766f"/>
      <rect x="780" y="34" width="90" height="7" rx="3.5" fill="#fffaf0"/>
      <rect x="780" y="48" width="58" height="7" rx="3.5" fill="#f1bd38"/>
    </g>
    <path class="wave" d="M426 78C458 58 494 58 526 78S590 98 622 78" stroke="#5a9ea0"/>
    <circle cx="330" cy="62" r="8" fill="#18766f"/>
    <circle cx="650" cy="36" r="8" fill="#f1bd38"/>
    <circle cx="1044" cy="72" r="8" fill="#c8342f"/>
  </g>
</svg>
